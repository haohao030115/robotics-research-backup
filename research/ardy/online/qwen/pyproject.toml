[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-ardy-closed-loop"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openai>=2.0", "pydantic>=2.0", "numpy>=1.23", "Pillow>=10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

